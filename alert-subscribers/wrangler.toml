name = "alert-subscribers"
main = "src/index.ts"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[[queues.consumers]]
queue = "send-alerts"
max_batch_size = 10
max_batch_timeout = 15
max_retries = 20
dead_letter_queue = "send-alerts-failed"
