<!doctype html>
<html lang="en">
  <head>

      .gtm-iframe-hidden {
        display: none;
        visibility: hidden;
      }
    </style>

    <meta charset="utf-8" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="%sveltekit.assets%/ms-icon-144x144.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />

    <link
      rel="icon"
      type="image/x-icon"
      href="%sveltekit.assets%/favicon.ico"
    />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />

    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="%sveltekit.assets%/apple-icon-57x57.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="60x60"
      href="%sveltekit.assets%/apple-icon-60x60.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="72x72"
      href="%sveltekit.assets%/apple-icon-72x72.png"

      rel="apple-touch-icon"

    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"

    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

    %sveltekit.head%

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
